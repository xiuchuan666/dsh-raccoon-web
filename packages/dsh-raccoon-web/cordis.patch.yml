# dsh-raccoon-web 的 bundle 补丁层
#
# `id: llm-raccoon-web` 是 cordis 树里的节点 id（不要跟 provider id `raccoon-web` 混淆）。
# `name` 必须与包名一致，宿主靠它解析到本包的 lib/index.js。
#
# 注意：这个文件只应该包含我们自己的一条。其它 profile 级 override 写在
# ~/.dsh/profiles/<profile>/cordis.patch.yml 里，不要写在这里。
- insert:
    - id: llm-raccoon-web
      name: dsh-raccoon-web
